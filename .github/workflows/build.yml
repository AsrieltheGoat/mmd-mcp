name: Build and test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 / Python 3.10
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure Windows locale for Japanese UI tests
        shell: pwsh
        run: |
          Set-WinSystemLocale ja-JP
          Set-WinUserLanguageList ja-JP -Force
          Set-Culture ja-JP
          Set-WinHomeLocation -GeoId 122
          Write-Host "Configured system locale, user language, culture, and region for Japan."

      - name: Set up 64-bit Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          architecture: "x64"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install project and pinned dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e .

      - name: Build and verify Windows x64 wheel
        shell: pwsh
        run: python scripts/build_package.py

      - name: Run unit tests (non-blocking)
        shell: pwsh
        continue-on-error: true
        run: python -m unittest discover -s tests -v

      - name: Run MCP smoke test
        shell: pwsh
        run: python scripts/smoke_mcp.py

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: mmd-mcp-windows-x64-py310
          path: dist/mmd_mcp-*-py3-none-win_amd64.whl
          if-no-files-found: error
          retention-days: 14
