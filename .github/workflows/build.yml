name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 / Python 3.10
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up 64-bit Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          architecture: "x64"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install project and pinned dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e .

      - name: Build native selection DLL
        shell: cmd
        run: scripts\build_native.cmd

      - name: Verify native DLL exists
        shell: pwsh
        run: |
          $dll = "src/mmd_mcp/_native/mmd_selection.dll"
          if (-not (Test-Path $dll)) {
            throw "Native DLL was not produced: $dll"
          }
          Get-Item $dll | Format-List FullName, Length

      - name: Run unit tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Run MCP smoke test
        shell: pwsh
        run: python scripts/smoke_mcp.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mmd-mcp-windows-x64-py310
          path: |
            src/mmd_mcp/_native/mmd_selection.dll
            src/mmd_mcp/**
            pyproject.toml
            README.md
            README.en.md
            LICENSE
            THIRD_PARTY_NOTICES.md
          if-no-files-found: error
          retention-days: 14
